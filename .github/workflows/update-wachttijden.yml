name: Dagelijkse wachttijden-update

on:
  workflow_dispatch:
  schedule:
    - cron: '15 6 * * *'
      timezone: 'Europe/Amsterdam'

permissions:
  contents: write

concurrency:
  group: wachtlijsten-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Repository ophalen
        uses: actions/checkout@v4

      - name: Python instellen
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Node instellen
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Bronnen controleren en JSON maken
        run: node scripts/update-wachttijden.mjs

      - name: Resultaat committen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add wachtlijsten_data.json
          if git diff --cached --quiet; then
            echo "Geen wijziging om te committen."
          else
            git commit -m "Automatische update wachttijden"
            git push
          fi
